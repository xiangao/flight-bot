routes:
  - name: "Asia Grand Tour"
    type: multi_city
    provider: serpapi
    date_start: "2026-09-01"   # cheaper in September; overrides global Oct-Nov window
    date_end: "2026-10-31"
    weekdays: [Tue, Thu]       # Tue/Thu departures tend to be cheapest
    sample_dates: 30           # high -> sampler returns EVERY Tue/Thu in the viable window
    segments:
      - origin: BOS
        destination: NRT
        stay_min: 7
        stay_max: 10
      - origin: KIX
        destination: HKG
        stay_min: 14
        stay_max: 18
      - origin: HKG
        destination: BOS
    max_stops: 0   # each leg nonstop: BOS→NRT, KIX→HKG, HKG→BOS

  - name: "BOS ↔ Beijing / Shanghai / HK"
    csv_name: "Boston-China 3-week"   # matches historical CSV data
    type: round_trip
    provider: ignav
    origin: BOS
    destinations:
      - code: PEK
        name: Beijing
      - code: PVG
        name: Shanghai
      - code: HKG
        name: Hong Kong
    date_start: "2026-09-01"   # widened from global Oct-1 start (was Sep-only on the
                                # now-retired Hainan Direct route) so this route alone
                                # still catches cheap September dates for any carrier
    sample_dates: 8             # widened from global default of 4, to match the density
                                # the retired route used to check
    stay_min: 21
    stay_max: 30
    stay_step: 3
    max_stops: 1   # show both nonstop and 1-stop live panels
    # A dedicated "Hainan Direct BOS-PEK" SerpAPI route lived here until
    # 2026-07-22, added on the belief that "Ignav carries no Hainan fares at
    # all for this route." That was verified WRONG by querying Ignav's API
    # directly: it returned Hainan flight HU730/729 (Boeing 787, BOS-PEK) as a
    # single correctly-nonstop segment, at prices matching SerpAPI exactly
    # ($1,106 for Oct21->Nov11, $944 for Sep30->Oct21). Retired as redundant —
    # this route already covers Hainan via Ignav (free) with no loss of
    # correctness. See git history for the removed route if ever needed again.

search:
  provider: ignav
  date_start: "2026-10-01"
  date_end: "2026-11-30"
  sample_dates: 4
  alert_threshold: 0.10
  cache_hours: 6
  market: US
  cabin_class: economy
